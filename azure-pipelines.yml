# Starter pipeline
# Start with a minimal pipeline that you can customize to build and deploy your code.
# Add steps that build, run tests, deploy, and more:
# https://aka.ms/yaml

trigger:
- main

pool:
  vmImage: ubuntu-latest

stages:

- stage: DeployAPI
  displayName: 'Build and Deploy API'
  jobs:
  - job: BuildAndDeployAPI
    displayName: 'Build and Deploy .NET API'
    steps:

    - task: UseDotNet@2
      displayName: 'Use .NET 9'
      inputs:
        packageType: 'sdk'
        version: '9.x'

    - script: dotnet restore
      displayName: 'Restore packages'
      workingDirectory: 'PersonalTrainer.API'

    - script: dotnet build --configuration Release
      displayName: 'Build'
      workingDirectory: 'PersonalTrainer.API'

    - script: dotnet publish --configuration Release --output $(Build.ArtifactStagingDirectory)/api
      displayName: 'Publish'
      workingDirectory: 'PersonalTrainer.API'

    - task: AzureWebApp@1
      displayName: 'Deploy to Azure App Service'
      inputs:
        azureSubscription: 'AzureServiceConnection'
        appType: 'webAppLinux'
        appName: 'personaltrainer-api'
        package: '$(Build.ArtifactStagingDirectory)/api'

- stage: DeployFrontend
  displayName: 'Build and Deploy Frontend'
  dependsOn: DeployAPI
  jobs:
  - job: BuildAndDeployFrontend
    displayName: 'Build and Deploy React App'
    steps:

    - task: UseNode@1
      displayName: 'Use Node.js'
      inputs:
        version: '20.x'

    - script: npm install
      displayName: 'Install dependencies'
      workingDirectory: 'PersonalTrainer.Client'

    - script: npm run build
      displayName: 'Build React app'
      workingDirectory: 'PersonalTrainer.Client'
      env:
        VITE_API_URL: 'https://personaltrainer-api.azurewebsites.net/api'

    - script: npm install -g @azure/static-web-apps-cli
      displayName: 'Install SWA CLI'

    - script: swa deploy ./PersonalTrainer.Client/dist --deployment-token $(STATIC_WEB_APP_TOKEN) --env production
      displayName: 'Deploy to Static Web Apps'